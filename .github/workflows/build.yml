name: Build iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.4.app

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Determine Version
      id: version
      run: |
        git fetch --tags --force origin 2>/dev/null || true
        HIGHEST_NUM=0
        for tag in $(git tag -l 'v1.*'); do
          num=$(echo "$tag" | sed 's/v1\.//' | sed 's/^0*//')
          if [ -n "$num" ] && [ "$num" -gt "$HIGHEST_NUM" ] 2>/dev/null; then
            HIGHEST_NUM=$num
          fi
        done
        NEW_NUM=$((HIGHEST_NUM + 1))
        NEW_VERSION="1.$(printf '%02d' $NEW_NUM)"
        echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        echo "Building version $NEW_VERSION (previous highest was v1.$(printf '%02d' $HIGHEST_NUM))"

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build App
      run: |
        xcodebuild -resolvePackageDependencies -project TeleStream.xcodeproj
        xcodebuild clean build \
          -project TeleStream.xcodeproj \
          -scheme TeleStream \
          -sdk iphoneos \
          -destination "generic/platform=iOS" \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          MARKETING_VERSION=${{ steps.version.outputs.version }} \
          CURRENT_PROJECT_VERSION=${{ github.run_number }}

    - name: Package IPA
      id: package
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/TeleStream.app Payload/
        plutil -replace CFBundleShortVersionString -string "${{ steps.version.outputs.version }}" Payload/TeleStream.app/Info.plist
        plutil -replace CFBundleVersion -string "${{ steps.version.outputs.version }}" Payload/TeleStream.app/Info.plist
        zip -r TeleStream.ipa Payload
        IPA_SIZE=$(stat -f%z TeleStream.ipa 2>/dev/null || stat -c%s TeleStream.ipa 2>/dev/null || echo 0)
        echo "size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeleStream-iOS
        path: TeleStream.ipa

    - name: Publish Versioned Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        VERSION_TAG="v${VERSION}"

        # Create the versioned release
        git tag -f "$VERSION_TAG"
        git push origin "$VERSION_TAG" --force

        NOTES="## TeleStream v${VERSION}

        Built from commit $(git rev-parse --short HEAD) on $(date -u '+%Y-%m-%d %H:%M UTC')

        ### Install on iPhone
        1. Download **TeleStream.ipa** below
        2. Use LiveContainer, AltStore, or SideStore to install
        3. Open the app and log in with QR code or phone number"

        gh release create "$VERSION_TAG" TeleStream.ipa \
          --title "TeleStream v${VERSION}" \
          --notes "$NOTES" \
          --latest

    - name: Update sources.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        IPA_SIZE="${{ steps.package.outputs.size }}"
        python3 - <<EOF
        import json, datetime, os

        version = "$VERSION"
        size = int("$IPA_SIZE") if "$IPA_SIZE".isdigit() else 0
        now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

        if os.path.exists("sources.json"):
            with open("sources.json", "r") as f:
                data = json.load(f)
            
            for app in data.get("apps", []):
                if app.get("bundleIdentifier") == "com.telestream.TeleStream":
                    app["version"] = version
                    app["versionDate"] = now
                    if size > 0:
                        app["size"] = size
                    app["downloadURL"] = "https://github.com/NB6RULES/TeleStream/releases/latest/download/TeleStream.ipa"
                    
                    if "versions" not in app:
                        app["versions"] = []
                    
                    app["versions"] = [v for v in app["versions"] if v.get("version") != version]
                    app["versions"].insert(0, {
                        "version": version,
                        "date": now,
                        "size": size,
                        "downloadURL": f"https://github.com/NB6RULES/TeleStream/releases/download/v{version}/TeleStream.ipa",
                        "localizedDescription": f"TeleStream v{version} automated build."
                    })
                    app["versions"] = app["versions"][:10]

            with open("sources.json", "w") as f:
                json.dump(data, f, indent=2)
                f.write("\n")
        EOF

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add sources.json
        if ! git diff --staged --quiet; then
          git commit -m "chore: update sources.json for v${VERSION} [skip ci]"
          git push origin main
        fi

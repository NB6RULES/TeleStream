name: TeleStream
options:
  bundleIdPrefix: com.telestream
  deploymentTarget:
    iOS: "16.0"

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    branch: main

targets:
  TeleStream:
    type: application
    platform: iOS
    sources: [TeleStream/Sources]
    info:
      path: TeleStream/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
    settings:
      base:
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: TDLibKit
        product: TDLibKit

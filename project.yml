name: TeleStream
options:
  bundleIdPrefix: com.telestream
  deploymentTarget:
    iOS: "16.0"

packages:
  TDLibKit:
    url: https://github.com/Swiftgram/TDLibKit
    branch: main
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    # Pinned: KSPlayer main now requires Swift tools 6.2 (Xcode 26), which the
    # macos-15 runner doesn't have. This is the revision that built v1.59.
    revision: af2e26f68b5bf726463850fe19c23c08a0d56577

targets:
  TeleStream:
    type: application
    platform: iOS
    sources:
      - TeleStream/Sources
    info:
      path: TeleStream/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - package: TDLibKit
        product: TDLibKit
      - package: KSPlayer
        product: KSPlayer
